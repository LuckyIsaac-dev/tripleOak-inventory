<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>store</title>
    <link rel="stylesheet" href="styles/stores.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-title">
        <h1>HydroTrack</h1>
        <p>Bottled Water Inventory Management</p>
      </div>
      <button class="add-product-btn">+ Add New Product</button>
    </header>

    <section class="stats-overview">
      <div class="stat-card">
        <h3>Total Items</h3>
        <p class="stat-number">6</p>
      </div>
      <div class="stat-card">
        <h3>Total Stock (Crats/Pcs)</h3>
        <p class="stat-number">1,240</p>
      </div>
      <div class="stat-card low-stock-alert">
        <h3>Low Stock Alerts</h3>
        <p class="stat-number">2</p>
      </div>
    </section>
    <div class="update-model-overlay">
      <div class="update-model">
        <div class="model-header">
          <h3>Update Stock</h3>
          <p>Eva 75cl</p>
        </div>

        <p>New quantity</p>
        <input type="text" class="update-quantity-input" />
        <div class="btn-container">
          <button class="cancel-btn">Cancel</button
          ><button class="update-btn">Update Quantity</button>
        </div>
      </div>
    </div>

    <main class="products-grid">
      <div class="product-card" style="animation-delay: 0s">
        <div class="card-image-wrap">
          <img
            src="https://www.evawater.com.ng/wp-content/uploads/2021/07/75cl.png"
            alt="Eva 75cl"
            onerror="
              this.style.display = 'none';
              this.nextElementSibling.style.display = 'flex';
            "
            style="display: none"
          />
          <div class="placeholder-img" style="display: flex">💧</div>
          <span class="stock-badge out-of-stock">Out of Stock</span>
        </div>
        <div class="card-body">
          <div class="card-brand">Eva</div>
          <div class="card-name">Eva 75cl</div>
          <div class="card-stats">
            <div class="card-stat">
              <div class="stat-label">Quantity</div>
              <div class="stat-value empty">0</div>
            </div>
            <div class="card-stat">
              <div class="stat-label">Price / Pack</div>
              <div class="stat-value">₦—</div>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-card btn-edit" onclick="openEditModal(1)">
              ✏️ Edit
            </button>
            <button class="btn-card btn-update" onclick="openQtyModal(1)">
              📦 Update Stock
            </button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="script/script.js"></script>
  </body>
</html>
