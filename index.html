<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>store</title>
    <link rel="stylesheet" href="styles/stores.css" />
  </head>
  <body>
    <dialog class="modal" style="max-width: 380px" closedby="closedrequest">
      <div class="modal-header">
        <div>
          <h3>Update Stock</h3>
          <p id="qty-modal-product-name">Product name</p>
        </div>
        <button class="modal-close" onclick="closeModal('qty-modal')">✕</button>
      </div>

      <div class="form-group" style="margin-bottom: 8px">
        <label>New Quantity</label>
        <div class="qty-controls">
          <input type="text" class="qty-input" />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel">Cancel</button>
        <button class="btn-save">Update Quantity</button>
      </div>
    </dialog>

    <main class="products-grid"></main>

    <script type="module" src="script/script.js"></script>
  </body>
</html>
